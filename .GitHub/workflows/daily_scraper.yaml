name: Daily Lotto Scraper

on:
  schedule:
    # Runs daily at 7:15 PM UTC (8:15 PM WAT)
    - cron: '15 19 * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      - name: Create Firebase Key File from Secret
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_KEY" > firebase_key.json

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Clean up keys
        run: rm firebase_key.json
